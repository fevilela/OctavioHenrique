<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Imagem hero de treinamento</title>
  <desc id="desc">Composição abstrata com silhueta atlética, brilho neon e detalhes geométricos para a seção principal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="42%" stop-color="#120f1f"/>
      <stop offset="100%" stop-color="#2d0f55"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="24%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#c58cff" stop-opacity=".48"/>
      <stop offset="58%" stop-color="#8f46ff" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#8f46ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="82%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#9b5cff" stop-opacity=".58"/>
      <stop offset="48%" stop-color="#7b35f5" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7b35f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#f3e8ff" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1ddff"/>
      <stop offset="45%" stop-color="#b56fff"/>
      <stop offset="100%" stop-color="#7b35f5"/>
    </linearGradient>
    <filter id="blurXL" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glowLeft)"/>
  <rect width="1600" height="900" fill="url(#glowRight)"/>

  <g opacity=".55">
    <ellipse cx="1225" cy="458" rx="300" ry="340" fill="#7b35f5" opacity=".18" filter="url(#blurXL)"/>
    <ellipse cx="1350" cy="520" rx="170" ry="250" fill="#c58cff" opacity=".18" filter="url(#blurXL)"/>
  </g>

  <g opacity=".4" fill="none" stroke="url(#line)">
    <path d="M-100 710h1900" stroke-width="2"/>
    <path d="M-100 760h1900" stroke-width="1.5"/>
    <path d="M-100 810h1900" stroke-width="1.2"/>
  </g>


      <path d="M131 64c-7 86-38 141-74 204-30 52-45 111-55 170-11 68-18 141 6 206 12 34 36 67 71 81 37 15 82 7 114-18 36-27 58-70 63-114 8-69-9-137-10-205-1-55 10-112 33-162 24-54 61-101 74-159" stroke-width="12"/>
      <path d="M128 76c25 23 58 36 91 42 30 5 61 6 87 24 29 20 43 54 47 88" stroke-width="9" opacity=".8"/>
      <path d="M63 258c48 25 94 51 129 92 28 33 44 74 59 115 23 66 44 140 27 208" stroke-width="10" opacity=".82"/>
      <path d="M67 279c28 17 56 35 79 58 30 30 49 67 63 107 20 59 34 123 24 185" stroke-width="4.5" opacity=".82"/>
      <path d="M88 237c61 25 117 61 163 108 32 34 56 74 79 113" stroke-width="4.5" opacity=".78"/>
      <path d="M15 371c53-28 114-39 173-32 57 6 113 30 160 64" stroke-width="5" opacity=".6"/>
      <path d="M26 410c57-27 125-32 186-15 46 13 88 39 122 72" stroke-width="3.6" opacity=".56"/>
      <path d="M121 652c24 9 51 12 76 6 29-8 52-28 69-52" stroke-width="5" opacity=".68"/>
